<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Flash no habilitado — Destello·Sync</title>
<style>
:root{--bg:#0c0d10;--card:#17191e;--fg:#f7f7f5;--muted:#a3a8b3;--line:#30343c;--accent:#f6d20a}

body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;line-height:1.5}
main{max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}

p{color:var(--muted);margin:0 0 18px}

</head>
<body>
<main>
  <h1>La app Flash no está habilitada</h1>
  <p>El operador del evento todavía no activó este acceso, o ya terminó. Si tenés un QR del evento actual, escanealo de nuevo; si el operador te indicó un código, ingresalo en la página principal.</p>
  <a href="/">Ir a la página principal</a>
